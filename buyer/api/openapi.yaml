            otherwise.
          type: object
        findIndex:
          description: |-
            Returns the index of the first element in the array where predicate is true, and -1
            otherwise.
          type: object
        entries:
          description: Returns an iterable of key, value pairs for every entry in
            the array
          type: object
        keys:
          description: Returns an iterable of keys in the array
          type: object
        values:
          description: Returns an iterable of values in the array
          type: object
        includes:
          description: Determines whether an array includes a certain element, returning
            true or false as appropriate.
          type: object
        flatMap:
          description: |-
            Calls a defined callback function on each element of an array. Then, flattens the result into
            a new array.
            This is identical to a map followed by flat with depth 1.
          type: object
        flat:
          description: |-
            Returns a new array with all sub-array elements concatenated into it recursively up to the
            specified depth.
          type: object
        at:
          description: Returns the item located at the specified index.
          type: object
