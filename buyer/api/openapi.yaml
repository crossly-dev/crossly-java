          type: object
        forEach:
          description: Performs the specified action for each element in an array.
          type: object
        map:
          description: Calls a defined callback function on each element of an array,
            and returns an array that contains the results.
          type: object
        filter:
          description: Returns the elements of an array that meet the condition specified
            in a callback function.
          type: object
        reduce:
          description: Calls the specified callback function for all the elements
            in an array. The return value of the callback function is the accumulated
            result, and is provided as an argument in the next call to the callback
            function.
          type: object
        reduceRight:
          description: Calls the specified callback function for all the elements
            in an array, in descending order. The return value of the callback function
            is the accumulated result, and is provided as an argument in the next
            call to the callback function.
          type: object
        find:
          description: |-
