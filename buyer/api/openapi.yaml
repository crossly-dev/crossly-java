            code has never been measured — shown as "code available" rather than as a
            number, because an invented figure is the one thing that turns a helpful
            overlay into a liar.
          nullable: true
          type: number
        minSpendCents:
          nullable: true
          type: number
        recentSuccesses:
          description: So a claim is checkable rather than asserted.
          type: number
        recentAttempts:
          type: number
