          enum:
          - opened
          - intact
          - suspect
          - unknown
          type: string
        reasons:
          items:
            type: object
          type: array
        headline:
          description: One sentence for a human who will read nothing else.
          type: string
      required:
      - headline
      - reasons
      - verdict
      type: object
    GetOrderEvidenceResponse_seal:
      properties:
        assessment:
          $ref: '#/components/schemas/GetOrderEvidenceResponse_seal_assessment'
        dispatchSearchedFrames:
          description: |-
            How many packing frames were searched to find the dispatch frame shot
            closest to the arrival angle. Null when the dispatch reading was simply
            the frame the recorder ended on.

            Surfaced rather than kept internal: "the best of eighteen frames
            matched" is a weaker claim than "the frame we took matched", and a
            reviewer has to be able to tell them apart. See frame-match.ts.
          nullable: true
          type: number
        hasDispatch:
          type: boolean
        hasArrival:
          type: boolean
        hasCourierPhoto:
          description: A courier photo exists, even if the seal was not legible in
            it.
          type: boolean
      required:
      - assessment
      - hasArrival
      - hasCourierPhoto
      - hasDispatch
      type: object
