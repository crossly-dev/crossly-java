      type: object
    GetSpatialPublicResponse_profile:
      properties:
        categorySlug:
          description: Matches `crossly_market_categories.slug`, or '*' for the fallback.
          type: string
        label:
          description: Room title, shown in the switcher.
          type: string
        tagline:
          description: One line of why this space is shaped the way it is. Surfaced
            in the UI.
          type: string
        presentation:
          enum:
          - flat
          - slabbed
          - boxed
          - cased
          - spined
          - hanging
          - standing
          type: string
        itemModelVariants:
          description: "Other meshes items in this category may be drawn as, chosen\
            \ PER ITEM.\r\n\r\nOne model per category is right for a card room, where\
            \ every object is the\r\nsame object. It is wrong for a wardrobe: a rail\
            \ holds tees and jeans and\r\njackets, and drawing all of them as a tee\
            \ would be a worse lie than the\r\nflat quad it replaced, because a wrong\
            \ SHAPE reads as information.\r\n\r\nThe renderer picks from `[itemModel,\
            \ ...itemModelVariants]` using the\r\nitem's title — the same heuristic\
            \ `silhouetteFor` already uses to choose a\r\ngarment outline, and for\
            \ the same reason: the title is the only signal\r\npresent on every item,\
            \ and a wrong guess costs a slightly odd shape rather\r\nthan the wrong\
            \ item. `itemModel` is the fallback when nothing matches.\r\n\r\nDeliberately\
            \ NOT fuzzy-matched against a catalog — this picks a SHAPE, not\r\nan\
            \ identity. See docs/IDENTIFIER-FIRST.md for where that line sits."
          items:
            enum:
            - item-card
            - item-card-slab
            - item-comic
            - item-comic-slab
            - item-vinyl
            - item-vinyl-disc
            - item-funko-box
            - item-lego-box
            - item-minifig
            - item-game-case
            - item-book
            - item-sneaker
            - item-boot
            - item-handbag
            - item-watch
            - item-phone
            - item-laptop
            - item-tee
            - item-hoodie
            - item-jacket
            - item-jeans
            - item-dress
            - item-skirt
            type: string
          nullable: true
          type: array
        itemSize:
          $ref: '#/components/schemas/GetSpatialPublicResponse_profile_itemSize'
        containers:
          description: "The container ladder, OUTERMOST FIRST. A binder holds pages,\
            \ a page holds\r\ncards. The solver walks this to decide what to create\
            \ next when the\r\ncurrent container fills up."
          items:
            $ref: '#/components/schemas/GetSpatialPublicResponse_profile_containers'
          type: array
        defaultGroupBy:
          description: Default grouping, in order. Each level becomes a divider or
            a container.
          items:
            enum:
            - brand
            - condition
            - size
            - status
            - label
            - title
            - value
            - year
            - grade
            - set
            - franchise
            - game
            - team
            - era
            - genre
            - colour
            - age
            type: string
          type: array
        defaultSortBy:
          description: Default ordering inside a group.
          items:
            enum:
            - brand
            - condition
            - size
            - status
            - label
            - title
            - value
            - year
            - grade
            - set
            - franchise
            - game
            - team
            - era
            - genre
            - colour
            - age
            type: string
          type: array
        gradedVariant:
          description: "A SEPARATE profile for graded/sealed copies of the same category.\r\
            \n\r\nThis is not a flourish. Nobody puts a slabbed card in a binder —\
            \ it does\r\nnot fit and it would be vandalism. Graded cards go on a wall,\
            \ raw cards go\r\nin pockets, and a space that ignores that is immediately\
            \ wrong to the only\r\npeople who would use it. Same for CGC comics."
          nullable: true
          type: string
      required:
      - categorySlug
      - containers
      - defaultGroupBy
      - defaultSortBy
      - itemSize
      - label
      - presentation
      - tagline
      type: object
