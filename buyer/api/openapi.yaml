  /v1/buyer/activity:
    get:
      description: Newest first, and only as far back as the retention window — the
        link between a person and a comparison is dropped after 180 days, so this
        thins out rather than growing forever.
      operationId: listBuyerActivity
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/V1List'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/ListBuyerActivityItem'
                      type: array
                  type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: What this buyer has compared lately.
      tags:
      - Buyer
      x-accepts: application/json
    post:
      description: Records the look and returns whether Crossly has the item and at
        what price. Send an identifier and a store DOMAIN — a full URL is refused.
        Nothing about the page itself is stored.
      operationId: createBuyerActivity
      requestBody:
        $ref: '#/components/requestBodies/inline_object_4'
        content:
          application/json:
            schema:
              properties:
                namespace:
                  enum:
                  - gtin
                  - style_code
                  - lego_set
                  - tcgplayer
                  - discogs
                  - asin
                  type: string
                value:
                  type: string
                retailHost:
                  type: string
                pagePriceCents:
                  minimum: 0
                  type: integer
                pageCurrency:
                  maxLength: 3
                  minLength: 3
                  type: string
              required:
              - namespace
              - value
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBuyerActivityResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Report an item your user is looking at, and get our answer.
      tags:
      - Buyer
      x-contentType: application/json
      x-accepts: application/json
  /v1/buyer/preferences:
    get:
      description: Derived, never declared — there is no preferences form anywhere.
