  /v1/buyer/catalog/browse:
    get:
      description: Page-numbered and capped at 50 pages of up to 60, like the storefront.
        For walking the whole catalogue use /v1/buyer/catalog/search, which pages
        by cursor. Prices are integer CENTS (`minPriceCents=2500` is $25.00). `sold=true`
        returns recent sales of matching listings (last 90 days) with `soldPriceCents`
        and `soldAt`, instead of live stock.
      operationId: listBuyerCatalogBrowse
      parameters:
      - description: Free text; every word must appear in the title or brand.
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: auction, buy_it_now, or offers (accepts offers).
        explode: true
        in: query
        name: format
        required: false
        schema:
          enum:
          - auction
          - buy_it_now
          - offers
          type: string
        style: form
      - description: true = only listings that accept returns.
        explode: true
        in: query
        name: returns
        required: false
        schema:
          enum:
          - "true"
          - "false"
          type: string
        style: form
      - description: true = recent sales instead of live listings.
        explode: true
        in: query
        name: sold
        required: false
        schema:
          enum:
          - "true"
          - "false"
          type: string
        style: form
      - description: Exact size, case-insensitive (M does not match XL).
        explode: true
        in: query
        name: size
        required: false
        schema:
          type: string
        style: form
      - description: Exact colour, case-insensitive.
        explode: true
        in: query
        name: color
        required: false
        schema:
          type: string
        style: form
      - description: 'ISO 3166-1 alpha-2 destination (e.g. GB): only listings whose
          seller ships there, decided as checkout decides it (the listing''s shipping
          policy and its own restricted countries). An embargoed destination matches
          nothing. Omitted, or `any`, means no destination filter — the storefront
          grid defaults to the buyer''s country, this endpoint does not.'
        explode: true
        in: query
        name: shipsTo
        required: false
        schema:
          type: string
        style: form
      - description: Default best_match with q, newest without.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          enum:
          - best_match
          - newest
          - price_low
          - price_high
          - popular
          - ending_soon
          type: string
        style: form
      - description: Lowest price, in cents.
        explode: true
        in: query
        name: minPriceCents
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      - description: Highest price, in cents.
        explode: true
        in: query
        name: maxPriceCents
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      - description: 1-indexed page.
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          maximum: 50
          minimum: 1
          type: integer
        style: form
      - description: Rows per page.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 24
          maximum: 60
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBuyerCatalogBrowseResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
