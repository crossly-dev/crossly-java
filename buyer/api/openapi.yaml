  /v1/buyer/checkout:
    post:
      description: 'An Idempotency-Key header is REQUIRED — this endpoint refuses
        without one, because a retried request would otherwise buy the item twice
        and a retry is the most likely thing an automated buyer does. Derive the key
        from what you are buying and reuse it across retries; a fresh random value
        per attempt satisfies the check and keeps the bug. The item is QUOTED first
        and the delivered total is checked against both your maxTotalCents and this
        key''s limits before anything is charged. Pass shippingServiceId to choose
        the shipping speed (default: the cheapest). A card that demands 3-D Secure
        cannot be charged unattended; that answers 402 with `authentication_required`
        and the purchase must be finished on Crossly. Optional payInCurrency (e.g.
        "eur") charges the card in that currency at the rate quoted in this request,
        including a 3% conversion charge; the response then carries chargeCurrency
        + chargeAmountMinor. Limits and maxTotalCents stay in USD cents. Pre-orders
        cannot be paid in another currency (422 currency_unavailable).'
      operationId: createBuyerCheckout
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBuyerCheckoutResponse'
          description: OK
