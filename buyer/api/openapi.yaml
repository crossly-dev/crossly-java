            \ sourced\r\nfrom the platform's own data instead of only manual entry.\
            \ Only set\r\nwhen the platform's response genuinely carries a semantically-matching\r\
            \nfield (eBay item specifics, Facebook attributes, Poshmark catalog,\r\
            \nDepop's detail-call ride-along) — never derived or guessed."
