    post:
      description: 'Send a barcode identifier OR a photo. A BARCODE establishes identity,
        so the response carries a full price verdict across Crossly and other retailers.
        A PHOTO establishes resemblance only: you get visual matches from the Crossly
        catalogue, and a price verdict ONLY if the matched listing carries a real
        identifier. When it does not, `comparable` is false and there is no verdict
