openapi: 3.0.3
info:
  description: 'The buyer-facing Crossly API — cart, orders, wishlists, offers, cashback.
    A DIFFERENT principal from the seller API: authenticated by a buyer OAuth token
    scoped `buyer:*` and resolved by `resolveBuyer`. A seller Personal Access Token
    will NOT authenticate these endpoints.'
  title: Crossly Buyer API
  version: 1.0.0
servers:
- url: https://crossly.net/api
security:
- BuyerOAuth: []
paths:
  /v1/buyer/profile:
    get:
      operationId: getBuyerProfile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerProfileResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Your Crossly shopping profile — name, email, saved address, Bucks balance.
      tags:
      - Buyer
      x-accepts: application/json
  /v1/buyer/orders:
    get:
      operationId: listBuyerOrders
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBuyerOrdersResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: What you have bought on Crossly, newest first.
      tags:
      - Buyer
      x-accepts: application/json
  /v1/buyer/cart:
    get:
      description: Line items with the price captured when each was added. This is
        NOT a quote — shipping, tax and any discounts are computed at checkout against
        a delivery address, and the sum of these lines is not what you will be charged.
      operationId: listBuyerCart
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBuyerCartResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: What is in your Crossly cart.
      tags:
      - Buyer
      x-accepts: application/json
  /v1/buyer/cashback:
    get:
      description: Newest first. `pending` means an order was reported and the retailer's
        return window has not closed; nothing is paid until it does. `expired` means
        a click was never reported as converting, which is the ordinary outcome for
        most clicks.
      operationId: listBuyerCashback
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - confirmed
          - rejected
          - paid
          - expired
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBuyerCashbackResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Your Scout cashback — pending, confirmed, paid.
      tags:
      - Buyer
      x-accepts: application/json
  /v1/buyer/wishlists:
    get:
      operationId: listBuyerWishlists
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBuyerWishlistsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Your wishlists.
      tags:
      - Buyer
      x-accepts: application/json
    post:
      operationId: createBuyerWishlist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuyerWishlistRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBuyerWishlistResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Create a wishlist.
      tags:
      - Buyer
      x-contentType: application/json
      x-accepts: application/json
  /v1/buyer/wishlists/{id}/items:
    get:
      operationId: listBuyerWishlistItems
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBuyerWishlistItemsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: What is on one wishlist.
      tags:
      - Buyer
      x-accepts: application/json
    post:
      operationId: createBuyerWishlistItem
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuyerWishlistItemRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerResponse2'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Add a listing to a wishlist.
      tags:
      - Buyer
      x-contentType: application/json
      x-accepts: application/json
  /v1/buyer/catalog/search:
    get:
      description: 'Keyset-paginated. Pass the `nextCursor` you were given back as
        `cursor`; page 500 costs the same as page 1. Cursors are opaque — do not parse
        them. Responses carry an ETag: send it back as If-None-Match and an unchanged
        page answers 304, which is free. `sort=popular` is deliberately unavailable,
        because a cursor into a continuously-reordering list silently skips rows.'
      operationId: listBuyerCatalogSearch
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBuyerCatalogSearchResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Search the Crossly catalogue.
      tags:
      - Buyer Catalog
      x-accepts: application/json
  /v1/buyer/catalog/listings/{slug}:
    get:
      operationId: getBuyerCatalogListing
      parameters:
      - explode: false
        in: path
        name: slug
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerCatalogListingResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: One listing, in full.
      tags:
      - Buyer Catalog
      x-accepts: application/json
  /v1/buyer/catalog/listings/{slug}/shipping:
    get:
      description: 'Lists every shipping service the seller offers to `country` (default:
        the seller’s own country) with its price for `quantity` units and its delivery
        window in business days (handling included). `zip` is required for a domestic
        quote. `shipsToCountry: false` means the seller does not ship there. Pass
        a service `id` as `shippingServiceId` to POST /api/v1/buyer/checkout, or in
        `shippingServiceBySeller` to POST /api/v1/buyer/cart/quote.'
      operationId: getBuyerCatalogListingShipping
      parameters:
      - explode: true
        in: query
        name: zip
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: country
        required: false
        schema:
          maxLength: 2
          minLength: 2
          type: string
        style: form
      - explode: true
        in: query
        name: quantity
        required: false
        schema:
          maximum: 999
          minimum: 1
          type: integer
        style: form
      - explode: false
        in: path
        name: slug
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerCatalogListingShippingResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Shipping services and prices to a destination.
      tags:
      - Buyer Catalog
      x-accepts: application/json
  /v1/buyer/catalog/listings/{slug}/availability:
    get:
      description: The cheapest endpoint here, and the one to poll if you are going
        to poll — a single indexed row, no joins beyond stock, and an ETag so an unchanged
        answer is a 304. If you want to be TOLD instead of asking, create a monitor.
      operationId: getBuyerCatalogListingAvailability
      parameters:
      - explode: false
        in: path
        name: slug
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerCatalogListingAvailabilityResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Is it still buyable, and at what price.
      tags:
      - Buyer Catalog
      x-accepts: application/json
  /v1/buyer/catalog/facets:
    get:
      description: The vocabulary the search filters accept. Counts are live, so a
        filter built from this will never return an empty page for a value that has
        since sold out.
      operationId: getBuyerCatalogFacet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerCatalogFacetResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Brands, categories and conditions that currently have stock.
      tags:
      - Buyer Catalog
      x-accepts: application/json
  /v1/buyer/catalog/fx:
    get:
      description: 'ECB daily reference rates rebased to US dollars: `rates.EUR =
        0.92` means $1 ≈ €0.92. `asOf` is the ECB publication date (null until the
        first refresh). For showing an approximate price only — every Crossly price
        and charge is in USD, and the card issuer sets the final exchange rate.'
      operationId: getBuyerCatalogFx
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerCatalogFxResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Display-only exchange rates (units per 1 USD).
      tags:
      - Buyer Catalog
      x-accepts: application/json
  /v1/buyer/listings/{slug}/landed-cost:
    get:
      description: 'Quotes the import duties, import taxes and fees for this listing
        shipped to `country` (ISO 3166-1 alpha-2), using the cheapest shipping service
        the seller offers there. `status: included` means checkout charges them now
        and the parcel ships DDP — no bill at the door; `unavailable` means it ships
        DDU and `notice` says the carrier or customs may charge on delivery; `none`
        means the parcel does not cross a border. Amounts are US-dollar cents. Answers
        503 with `missingEnv` when landed-cost quoting is not configured on this deployment.'
      operationId: getBuyerListingLandedCost
      parameters:
      - explode: true
        in: query
        name: country
        required: true
        schema:
          maxLength: 2
          minLength: 2
          type: string
        style: form
      - explode: true
        in: query
        name: postalCode
        required: false
        schema:
          maxLength: 16
          type: string
        style: form
      - explode: true
        in: query
        name: quantity
        required: false
        schema:
          maximum: 999
          minimum: 1
          type: integer
        style: form
      - explode: false
        in: path
        name: slug
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerListingLandedCostResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Import duties, taxes and fees to a country (landed cost).
      tags:
      - Buyer Catalog
      x-accepts: application/json
  /v1/buyer/anywhere:
    get:
      description: 'Answers with a VERDICT, not a list: crossly_best, offsite_cheaper,
        offsite_only or no_match. Offsite offers come from licensed affiliate product
        feeds, are ranked CHEAPEST-FIRST — commission only ever breaks a sub-$1 tie
        — and only appear when they beat the price you passed in. `shippingUnknown:
        true` means a compared price omitted postage, so present the result as "before
        postage" rather than as a delivered total. Crossly wins ties within $1; beyond
        that the honest answer wins.'
      operationId: getBuyerAnywhere
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerAnywhereResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Cheapest source for an item — Crossly first, then other retailers.
      tags:
      - Buyer Catalog
      x-accepts: application/json
  /v1/buyer/offers:
    get:
