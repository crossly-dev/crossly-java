        imageUrl: imageUrl
        available: 6.027456183070403
        priceCents: 0.8008281904610115
        title: title
        url: url
        slug: slug
      properties:
        kind:
          enum:
          - listing
          - ask
          type: string
        priceCents:
          type: number
        condition:
          description: |-
            Free-text on listings, an order-book grade ('DS') on asks. Never null on
            asks; frequently null on listings, which is itself informative.
          nullable: true
          type: string
        title:
          nullable: true
          type: string
        imageUrl:
          nullable: true
          type: string
        url:
          type: string
        slug:
          description: |-
            The public slug, when this offer is a marketplace listing.

            Present so Scout can buy it without parsing the URL it was given back.
            Null on an order-book ask, which is deliberate rather than an omission:
            an ask is a price in a book, not a thing with a checkout, and a Buy button
            on one would be a promise the market side cannot keep.
          nullable: true
          type: string
        available:
          description: How many the seller has. Caps the quantity stepper honestly.
          nullable: true
          type: number
      required:
      - kind
      - priceCents
      - url
      type: object
    CreateBuyerActivityResponse_match:
      example:
        offer:
          condition: condition
          kind: listing
          imageUrl: imageUrl
          available: 6.027456183070403
          priceCents: 0.8008281904610115
          title: title
          url: url
          slug: slug
        shippingKnown: true
        savingCents: 1.4658129805029452
        catalog:
          name: name
          brand: brand
          skuId: skuId
        verdict: cheaper
        conditionComparable: true
        alternates:
        - condition: condition
          kind: listing
          imageUrl: imageUrl
          available: 6.027456183070403
          priceCents: 0.8008281904610115
          title: title
          url: url
          slug: slug
        - condition: condition
          kind: listing
          imageUrl: imageUrl
          available: 6.027456183070403
          priceCents: 0.8008281904610115
          title: title
          url: url
          slug: slug
      nullable: true
      properties:
        verdict:
          enum:
          - cheaper
          - not_cheaper
          - no_page_price
          - currency_mismatch
          type: string
        offer:
          $ref: '#/components/schemas/CreateBuyerActivityResponse_match_offer'
        savingCents:
          description: Positive when cheaper. Null when no page price was supplied.
          nullable: true
          type: number
        conditionComparable:
          description: |-
            TRUE means the offer's condition and the page's are comparable. False
            means we matched the item but not its state — a used Crossly copy against
            a retailer's new one — and the UI must say so rather than claim a saving.
          type: boolean
        shippingKnown:
          description: |-
            Always false today. Crossly shipping is computed at checkout from the
            buyer's address, which Scout does not have and should not send. Present so
            the surface that renders "before shipping" is reading a fact rather than
            hard-coding an assumption that stops being true when we add it.
          type: boolean
        catalog:
          $ref: '#/components/schemas/GetCatalogLookupResponse_catalog'
        alternates:
          description: |-
            Other buyable offers for the SAME item, cheapest first, best excluded.

            Deliberately not "you might also like". We have no behavioural data to
            build that from, and inventing it would put unrelated items under a badge
            whose entire value is that it only ever appears when we have the thing the
            buyer is actually looking at.

            What these ARE is the same product from other sellers, in other
            conditions, at other prices — which is the choice a buyer on a product
            page genuinely wants, and the one a single "cheapest" result hides.
          items:
            $ref: '#/components/schemas/CreateBuyerActivityResponse_match_offer'
          type: array
      required:
      - alternates
      - conditionComparable
      - offer
      - shippingKnown
      - verdict
      type: object
