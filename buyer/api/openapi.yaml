    GetSpatialPublicResponse_profile_containers:
      properties:
        key:
          description: Stable key. Persisted on every placement — never renamed.
          type: string
        label:
          description: What the seller calls it. "Page 3", "Case", "Long box".
          type: string
        model:
          description: "Which hand-authored mesh renders this container. A small closed\
            \ set — the\r\nart budget lives here and nowhere else."
          type: string
        size:
          description: Outer bounds, for packing containers into a room.
          type: object
