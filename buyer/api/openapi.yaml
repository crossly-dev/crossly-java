        sellerNote:
          description: "The seller's own words about this item — the pre-scan hint,\
            \ or the\r\npost-scan note that supersedes it (see synthesize/seller-note.ts).\r\
            \nCarried on the payload so the TAXONOMY resolvers see it too: category\r\
            \nand facet picking happen in their own LLM calls, which never saw the\r\
            \nnote even after the main synthesis prompt did. A seller correcting the\r\
            \nvariant was still getting the category of the wrong one."
          nullable: true
          type: string
        priceLowCents:
          description: "Comp price band (cents), outlier-trimmed — low/median/high\
            \ across the\r\nmatched comps. The UI surfaces the range so the seller\
            \ prices\r\nstrategically instead of trusting one number; priceCents defaults\
            \ to\r\nthe median when the seller hasn't picked."
          nullable: true
          type: number
        priceMedianCents:
          nullable: true
          type: number
        priceHighCents:
          nullable: true
          type: number
        quantity:
          description: "Echoed seller-supplied listable-unit count from Magic List.\
            \ This is\r\nthe listing's ADVERTISED stock (how many of this listing\
            \ to sell).\r\nHydrates the form's `quantity` field. Undefined = leave\
            \ form default (1)."
          nullable: true
          type: number
        inventoryQuantity:
          description: "Physical units the seller actually has in stock — becomes\
            \ the auto-\r\ncreated inventory item's quantity/quantityAvailable. Distinct\
            \ from\r\n`quantity` (advertised stock) and `unitsPerListing` (composition).\r\
            \nUndefined = fall back to `quantity`."
          nullable: true
          type: number
        unitsPerListing:
          description: "How many physical units are bundled inside ONE listing (composition;\r\
            \ne.g. a pack of 4). Becomes listing_inventory_items.quantity so the\r\
            \nmulti-channel fulfillable = floor(inventoryQuantity / unitsPerListing).\r\
            \nUndefined = 1."
          nullable: true
          type: number
        costBasisCents:
          description: "What the seller paid, per physical unit, in cents — the auto-created\r\
            \ninventory item's `costBasisCents`. Nothing wrote that column from any\r\
            \ncreate path, so every Magic List item had a NULL cost basis and every\r\
            \nsale of one reported its full sale price as profit. Undefined = unknown,\r\
            \nwhich stays NULL (0 would be a claim that the item was free)."
          nullable: true
          type: number
        chosenDimensions:
          $ref: '#/components/schemas/CreateMagicScanSynthesizeResponse_payload_chosenDimensions'
        imageUrls:
          description: "Every photo the seller uploaded for the source scan, primary\r\
            \nfirst. The NewListingPage hydrator drops these straight into the\r\n\
            form's images state so the seller doesn't have to re-upload."
          items:
            type: string
          nullable: true
          type: array
        category:
          $ref: '#/components/schemas/CreateMagicScanSynthesizeResponse_payload_category'
        department:
          description: "eBay item-specifics: Department/Gender/Style/Pattern/Type.\
            \ These\r\ndrive the eBay-required aspects on the form's Item Details\r\
            \nsection. Mostly only eBay matches have them."
          nullable: true
          type: string
        gender:
          nullable: true
          type: string
        style:
          nullable: true
          type: string
        pattern:
          nullable: true
          type: string
        itemType:
          nullable: true
          type: string
        upc:
          description: "Universal product code, when eBay's enriched detail surfaced\
            \ it.\r\nHydrates the master form's UPC/GTIN field."
          nullable: true
          type: string
        handlingTimeDays:
          nullable: true
          type: string
        returnWindowDays:
          nullable: true
          type: string
        tags:
          items:
            type: string
          nullable: true
          type: array
        itemSpecifics:
          description: "Master-level item specifics (JSON Record<string,string[]>).\
            \ Item\r\nspecifics are now master-owned + fanned to every aspect platform,\
            \ so the\r\nform's shared Item-specifics editor prefills from this. Mirrored\
            \ from the\r\nrichest resolved per-platform specifics blob (eBay after\
            \ full-aspect\r\nenrichment). Undefined = no specifics."
          nullable: true
          type: string
        perPlatformOverrides:
          description: "Per-platform required-fields map — slotted directly into\r\
            \nplatformOverrides when the form hydrates."
          type: object
        confidence:
          description: "AI's confidence in the synthesis (0-1). Surfaced to the seller\r\
            \nso they can decide whether to skim or trust + click."
          type: number
        notes:
          description: "AI's free-text rationale for the merge — what it pulled from\r\
            \nwhere. Helps the seller spot a bad merge before listing."
          nullable: true
          type: string
