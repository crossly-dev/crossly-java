openapi: 3.0.3
info:
  description: 'The buyer-facing Crossly API — cart, orders, wishlists, offers, cashback.
    A DIFFERENT principal from the seller API: authenticated by a buyer OAuth token
    scoped `buyer:*` and resolved by `resolveBuyer`. A seller Personal Access Token
    will NOT authenticate these endpoints.'
  title: Crossly Buyer API
  version: 1.0.0
servers:
- url: https://crossly.net/api
security:
- BuyerOAuth: []
paths:
  /v1/buyer/profile:
    get:
      operationId: getBuyerProfile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerProfileResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Your Crossly shopping profile — name, email, saved address, Bucks balance.
      tags:
      - Buyer
      x-accepts: application/json
  /v1/buyer/orders:
    get:
      operationId: listBuyerOrders
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/V1List'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/ListBuyerOrdersItem'
                      type: array
                  type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: What you have bought on Crossly, newest first.
      tags:
      - Buyer
      x-accepts: application/json
  /v1/buyer/cart:
    get:
      description: Line items with the price captured when each was added. This is
        NOT a quote — shipping, tax and any discounts are computed at checkout against
        a delivery address, and the sum of these lines is not what you will be charged.
      operationId: listBuyerCart
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/V1List'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/ListBuyerCartItem'
                      type: array
                  type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: What is in your Crossly cart.
      tags:
      - Buyer
      x-accepts: application/json
  /v1/buyer/cashback:
    get:
      description: Newest first. `pending` means an order was reported and the retailer's
        return window has not closed; nothing is paid until it does. `expired` means
        a click was never reported as converting, which is the ordinary outcome for
        most clicks.
      operationId: listBuyerCashback
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - confirmed
          - rejected
          - paid
          - expired
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/V1List'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/ListBuyerCashbackItem'
                      type: array
                  type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Your Scout cashback — pending, confirmed, paid.
      tags:
      - Buyer
      x-accepts: application/json
  /v1/buyer/wishlists:
    get:
      operationId: listBuyerWishlists
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/V1List'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/ListBuyerWishlistsItem'
                      type: array
                  type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Your wishlists.
      tags:
      - Buyer
      x-accepts: application/json
    post:
      operationId: createBuyerWishlist
      requestBody:
        $ref: '#/components/requestBodies/inline_object'
        content:
          application/json:
            schema:
              properties:
                name:
                  maxLength: 120
                  minLength: 1
                  type: string
              required:
              - name
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBuyerWishlistResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Create a wishlist.
      tags:
      - Buyer
      x-contentType: application/json
      x-accepts: application/json
  /v1/buyer/wishlists/{id}/items:
    get:
      operationId: listBuyerWishlistItems
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/V1List'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/ListBuyerWishlistItemsItem'
                      type: array
                  type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: What is on one wishlist.
      tags:
      - Buyer
      x-accepts: application/json
    post:
      operationId: createBuyerWishlistItem
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        $ref: '#/components/requestBodies/inline_object_1'
        content:
          application/json:
            schema:
              properties:
                listingSlug:
                  type: string
              required:
              - listingSlug
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBuyerWishlistItemResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Add a listing to a wishlist.
      tags:
      - Buyer
      x-contentType: application/json
      x-accepts: application/json
  /v1/buyer/catalog/search:
    get:
      description: 'Keyset-paginated. Pass the `nextCursor` you were given back as
        `cursor`; page 500 costs the same as page 1. Cursors are opaque — do not parse
        them. Responses carry an ETag: send it back as If-None-Match and an unchanged
        page answers 304, which is free. `sort=popular` is deliberately unavailable,
        because a cursor into a continuously-reordering list silently skips rows.'
      operationId: listBuyerCatalogSearch
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/V1List'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/ListBuyerCatalogSearchItem'
                      type: array
                  type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Search the Crossly catalogue.
      tags:
      - Buyer Catalog
      x-accepts: application/json
  /v1/buyer/catalog/listings/{slug}:
    get:
      operationId: getBuyerCatalogListing
      parameters:
      - explode: false
        in: path
        name: slug
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerCatalogListingResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: One listing, in full.
      tags:
      - Buyer Catalog
      x-accepts: application/json
  /v1/buyer/catalog/listings/{slug}/availability:
    get:
      description: The cheapest endpoint here, and the one to poll if you are going
        to poll — a single indexed row, no joins beyond stock, and an ETag so an unchanged
        answer is a 304. If you want to be TOLD instead of asking, create a monitor.
      operationId: getBuyerCatalogListingAvailability
      parameters:
      - explode: false
        in: path
        name: slug
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerCatalogListingAvailabilityResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Is it still buyable, and at what price.
      tags:
      - Buyer Catalog
      x-accepts: application/json
  /v1/buyer/catalog/facets:
    get:
      description: The vocabulary the search filters accept. Counts are live, so a
        filter built from this will never return an empty page for a value that has
        since sold out.
      operationId: getBuyerCatalogFacet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerCatalogFacetResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Brands, categories and conditions that currently have stock.
      tags:
      - Buyer Catalog
      x-accepts: application/json
  /v1/buyer/anywhere:
    get:
      description: 'Answers with a VERDICT, not a list: crossly_best, offsite_cheaper,
        offsite_only or no_match. Offsite offers come from licensed affiliate product
        feeds, are ranked CHEAPEST-FIRST — commission only ever breaks a sub-$1 tie
        — and only appear when they beat the price you passed in. `shippingUnknown:
        true` means a compared price omitted postage, so present the result as "before
        postage" rather than as a delivered total. Crossly wins ties within $1; beyond
        that the honest answer wins.'
      operationId: getBuyerAnywhere
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerAnywhereResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Cheapest source for an item — Crossly first, then other retailers.
      tags:
      - Buyer Catalog
      x-accepts: application/json
  /v1/buyer/cart/items:
    post:
      operationId: createBuyerCartItem
      requestBody:
        $ref: '#/components/requestBodies/inline_object_2'
        content:
          application/json:
            schema:
              properties:
                listingSlug:
                  type: string
                quantity:
                  default: 1
                  maximum: 10
                  minimum: 1
                  type: integer
              required:
              - listingSlug
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBuyerCartItemResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Add a listing to your cart.
      tags:
      - Buyer
      x-contentType: application/json
      x-accepts: application/json
  /v1/buyer/cart/items/{id}:
    delete:
      operationId: deleteBuyerCartItem
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: No Content — the request succeeded and there is no body.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Remove a line from your cart.
      tags:
      - Buyer
      x-accepts: application/json
  /v1/buyer/cart/quote:
    post:
      description: 'Runs the real checkout cascade and returns the totals instead
        of charging. Nothing is purchased. `taxComplete: false` means there is no
        saved delivery address, so the total is a floor rather than a final figure.'
      operationId: createBuyerCartQuote
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBuyerCartQuoteResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Price the cart, delivered — item, shipping, tax, total.
      tags:
      - Buyer
      x-accepts: application/json
  /v1/buyer/offers:
    post:
      description: Sends an offer to the seller. Spends nothing — a seller accepting
        still leaves you to complete checkout. Offers at or above the asking price
        are refused; buy it instead.
      operationId: createBuyerOffer
      requestBody:
        $ref: '#/components/requestBodies/inline_object_3'
        content:
          application/json:
            schema:
              properties:
                listingSlug:
                  type: string
                amountCents:
                  minimum: 100
                  type: integer
                message:
                  maxLength: 500
                  type: string
              required:
              - amountCents
              - listingSlug
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBuyerOfferResponse'
          description: OK
