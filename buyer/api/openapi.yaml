    GetConnectionHealthResponse_extension:
      properties:
        online:
          description: |-
            Heartbeat within the last 15 minutes. False is NOT proof of breakage —
            a closed browser looks the same — so it is always paired with the
            durable timestamp below.
          type: boolean
        lastBrowserPushAt:
          description: |-
            Newest browser push across every account. The durable answer to "when
            did the extension last do anything", surviving a Redis flush.
          nullable: true
          type: string
        lastBrowserPushAgo:
          type: string
        reportedVersion:
          description: |-
            Highest version any platform's browser report carried, or null when the
            extension has never told us (it does not send one today — see the
            service README notes in routes/extension-health.ts).
          nullable: true
          type: string
      required:
      - lastBrowserPushAgo
      - online
      type: object
    GetConnectionHealthResponse_liveness:
      properties:
        lastBrowserPushAt:
          description: The clean "the browser pushed cookies" signal.
          nullable: true
          type: string
        lastBrowserPushAgo:
          type: string
        lastSyncedAt:
          description: |-
            Also stamped by the executor on any successful server-side call, so it
            is NOT evidence the extension is alive. Exposed for debugging only.
          nullable: true
          type: string
        lastUsedAt:
          description: Last server-exec attempt, success or fail.
          nullable: true
          type: string
        lastUsedAgo:
          type: string
        authFailureStreak:
          type: number
      required:
      - authFailureStreak
      - lastBrowserPushAgo
      - lastUsedAgo
      type: object
    GetConnectionHealthResponse_browser:
      description: What the browser itself last reported, when it has reported at
        all.
      nullable: true
      properties:
        observations:
          items:
            type: object
          type: array
        cookieCount:
          type: number
        extensionVersion:
          nullable: true
          type: string
        observedAt:
          type: string
        observedAgo:
          type: string
      required:
      - cookieCount
      - observations
      - observedAgo
      - observedAt
      type: object
    GetConnectionHealthResponse_anchors:
      nullable: true
      properties:
        expected:
          description: What we were looking for. Empty ⇒ this platform is unmonitored.
          items:
            type: string
          type: array
        observations:
          items:
            type: object
          type: array
        present:
          description: Name found carrying a non-empty value — the only honest "logged
            in".
          items:
            type: string
          type: array
        empty:
          description: Name found, value is the empty string. The Whatnot class.
          items:
            type: string
          type: array
        missing:
          description: Name not in the jar at all.
          items:
            type: string
          type: array
        cookieCount:
          type: number
        observedCookieNames:
          description: |-
            Cookie names actually in the jar, truncated. This is the payload that turns
            "anchors missing" into a diagnosis: if the jar holds 30 cookies and none
            are ours, a rename is the likely story; if it holds three device cookies,
            the browser is signed out. NAMES ONLY — never values.
          items:
            type: string
          type: array
      required:
      - cookieCount
      - empty
      - expected
      - missing
      - observations
      - observedCookieNames
      - present
      type: object
    GetConnectionHealthResponse_accounts:
      properties:
        platformName:
